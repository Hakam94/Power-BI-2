<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; }
    a { color: #00D2FF; }
    a:hover { color: #39FF14; }
  </style>
</helmet>

<div style="position:relative; width:1080px; height:1920px; background:#0D2229; overflow:hidden; font-family:'Chakra Petch', system-ui, sans-serif; box-sizing:border-box; display:flex; flex-direction:column;">

  <!-- background texture behind the top content zone -->
  <svg width="1080" height="900" style="position:absolute; top:0; left:0;">
    <defs>
      <pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse">
        <circle cx="2" cy="2" r="1.4" fill="#39FF14" fill-opacity="0.10"/>
      </pattern>
    </defs>
    <rect width="1080" height="900" fill="url(#dots)"/>
  </svg>

  <!-- ============ TOP: padded content zone ============ -->
  <div style="position:relative; z-index:1; padding:56px 64px 0 64px; box-sizing:border-box;">

    <!-- top row: PART 6 + POWER BI / MCP tag -->
    <div style="display:flex; flex-direction:row; align-items:center; justify-content:space-between;">
      <div style="border:2px solid #00D2FF; background:rgba(0,210,255,0.08); border-radius:999px; padding:12px 26px; color:#00D2FF; font-family:'IBM Plex Mono', monospace; font-size:24px; font-weight:600; letter-spacing:4px;">PART 6</div>
      <div style="background:#39FF14; border-radius:999px; padding:12px 24px; color:#0D2229; font-family:'IBM Plex Mono', monospace; font-size:20px; font-weight:600; letter-spacing:2px;">POWER BI + MCP</div>
    </div>

    <!-- kicker -->
    <div style="margin-top:36px; color:#00D2FF; font-family:'IBM Plex Mono', monospace; font-size:24px; font-weight:600; letter-spacing:5px; text-transform:uppercase;">Connect your AI agents</div>

    <!-- headline -->
    <div style="margin-top:10px;">
      <div style="color:#39FF14; font-size:100px; line-height:0.98; font-weight:700; letter-spacing:-1px;">3 AI AGENTS.</div>
      <div style="color:#00D2FF; font-size:72px; line-height:1.04; font-weight:700; letter-spacing:-1px; margin-top:6px;">1 POWER BI FILE.</div>
    </div>

    <!-- diagram: 3 tool badges converging into Power BI -->
    <div style="position:relative; width:100%; height:330px; margin-top:44px;">

      <svg width="952" height="330" style="position:absolute; top:0; left:0;">
        <line x1="140" y1="130" x2="440" y2="196" stroke="#39FF14" stroke-opacity="0.5" stroke-width="3"/>
        <line x1="440" y1="130" x2="440" y2="196" stroke="#39FF14" stroke-opacity="0.5" stroke-width="3"/>
        <line x1="740" y1="130" x2="440" y2="196" stroke="#39FF14" stroke-opacity="0.5" stroke-width="3"/>
      </svg>

      <!-- Claude Code badge -->
      <div style="position:absolute; top:0; left:60px; width:160px; display:flex; flex-direction:column; align-items:center;">
        <div style="width:84px; height:84px; border-radius:20px; border:2px solid #00D2FF; background:rgba(0,210,255,0.07); display:flex; align-items:center; justify-content:center;">
          <svg width="40" height="40" viewBox="0 0 48 48">
            <g stroke="#39FF14" stroke-width="3.2" stroke-linecap="round">
              <line x1="24" y1="6" x2="24" y2="42"/>
              <line x1="6" y1="24" x2="42" y2="24"/>
              <line x1="10.5" y1="10.5" x2="37.5" y2="37.5"/>
              <line x1="37.5" y1="10.5" x2="10.5" y2="37.5"/>
            </g>
          </svg>
        </div>
        <div style="margin-top:12px; color:#EAF6F4; font-family:'IBM Plex Mono', monospace; font-size:19px; font-weight:600; text-align:center;">Claude Code</div>
      </div>

      <!-- Antigravity badge -->
      <div style="position:absolute; top:0; left:360px; width:160px; display:flex; flex-direction:column; align-items:center;">
        <div style="width:84px; height:84px; border-radius:20px; border:2px solid #00D2FF; background:rgba(0,210,255,0.07); display:flex; align-items:center; justify-content:center;">
          <svg width="40" height="40" viewBox="0 0 48 48">
            <circle cx="24" cy="24" r="17" fill="none" stroke="#39FF14" stroke-width="3.2"/>
            <path d="M24 34 L24 14 M24 14 L15 23 M24 14 L33 23" fill="none" stroke="#39FF14" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div style="margin-top:12px; color:#EAF6F4; font-family:'IBM Plex Mono', monospace; font-size:19px; font-weight:600; text-align:center;">Antigravity</div>
      </div>

      <!-- Codex badge -->
      <div style="position:absolute; top:0; left:660px; width:160px; display:flex; flex-direction:column; align-items:center;">
        <div style="width:84px; height:84px; border-radius:20px; border:2px solid #00D2FF; background:rgba(0,210,255,0.07); display:flex; align-items:center; justify-content:center;">
          <svg width="40" height="40" viewBox="0 0 48 48">
            <polygon points="24,6 40,15 40,33 24,42 8,33 8,15" fill="none" stroke="#39FF14" stroke-width="3.2" stroke-linejoin="round"/>
            <circle cx="24" cy="24" r="6" fill="none" stroke="#39FF14" stroke-width="3.2"/>
          </svg>
        </div>
        <div style="margin-top:12px; color:#EAF6F4; font-family:'IBM Plex Mono', monospace; font-size:19px; font-weight:600; text-align:center;">Codex</div>
      </div>

      <!-- Power BI convergence badge -->
      <div style="position:absolute; top:178px; left:280px; width:320px; display:flex; flex-direction:column; align-items:center;">
        <div style="width:150px; height:150px; border-radius:26px; border:3px solid #39FF14; background:rgba(57,255,20,0.06); display:flex; align-items:center; justify-content:center; box-shadow:0 0 44px rgba(0,210,255,0.18);">
          <svg width="80" height="80" viewBox="0 0 96 96">
            <rect x="16" y="52" width="14" height="30" rx="3" fill="#00D2FF"/>
            <rect x="41" y="34" width="14" height="48" rx="3" fill="#00D2FF"/>
            <rect x="66" y="16" width="14" height="66" rx="3" fill="#00D2FF"/>
          </svg>
        </div>
        <div style="margin-top:12px; color:#00D2FF; font-family:'IBM Plex Mono', monospace; font-size:22px; font-weight:600; letter-spacing:3px;">POWER BI</div>
      </div>

    </div>

  </div>

  <!-- ============ BOTTOM: full-bleed presenter photo hero ============ -->
  <div style="position:relative; z-index:1; flex:1; width:1080px; overflow:hidden;">

    <img src="hakam_photo.jpg" style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center 12%;">

    <!-- blend the photo into the panel above -->
    <div style="position:absolute; top:0; left:0; width:100%; height:150px; background:linear-gradient(#0D2229, rgba(13,34,41,0));"></div>

    <!-- bottom scrim for CTA legibility -->
    <div style="position:absolute; bottom:0; left:0; width:100%; height:420px; background:linear-gradient(rgba(13,34,41,0), rgba(13,34,41,0.55) 40%, #0D2229 92%);"></div>

    <!-- CTA + handle over the photo -->
    <div style="position:absolute; bottom:0; left:0; width:100%; display:flex; flex-direction:column; align-items:center; gap:16px; padding-bottom:56px; box-sizing:border-box;">
      <div style="border:2px solid #39FF14; background:rgba(13,34,41,0.55); border-radius:999px; padding:16px 32px; color:#39FF14; font-family:'Chakra Petch', sans-serif; font-size:30px; font-weight:600;">Full tutorial &rarr; link below</div>
      <div style="color:#7FE9DA; font-family:'IBM Plex Mono', monospace; font-size:23px; font-weight:500; letter-spacing:3px;">@HAKAMDATASTUDIO</div>
    </div>

  </div>

</div>
</x-dc>
</body>
</html>
