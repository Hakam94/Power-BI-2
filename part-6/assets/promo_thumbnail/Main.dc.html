<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; }
    a { color: #00D2FF; }
    a:hover { color: #39FF14; }
  </style>
</helmet>

<div style="position:relative; width:1080px; height:1920px; background:#0D2229; overflow:hidden; font-family:'Chakra Petch', system-ui, sans-serif; box-sizing:border-box;">

  <!-- background texture: soft radial glow + fine dot grid -->
  <svg width="1080" height="1920" style="position:absolute; inset:0;">
    <defs>
      <radialGradient id="glow" cx="50%" cy="62%" r="55%">
        <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.16"/>
        <stop offset="100%" stop-color="#00D2FF" stop-opacity="0"/>
      </radialGradient>
      <pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse">
        <circle cx="2" cy="2" r="1.4" fill="#39FF14" fill-opacity="0.10"/>
      </pattern>
    </defs>
    <rect width="1080" height="1920" fill="url(#dots)"/>
    <rect width="1080" height="1920" fill="url(#glow)"/>
  </svg>

  <!-- content column -->
  <div style="position:relative; z-index:1; display:flex; flex-direction:column; width:100%; height:100%; padding:64px; box-sizing:border-box;">

    <!-- top row: PART 6 + POWER BI / MCP tag -->
    <div style="display:flex; flex-direction:row; align-items:center; justify-content:space-between;">
      <div style="border:2px solid #00D2FF; background:rgba(0,210,255,0.08); border-radius:999px; padding:14px 28px; color:#00D2FF; font-family:'IBM Plex Mono', monospace; font-size:26px; font-weight:600; letter-spacing:4px;">PART 6</div>
      <div style="background:#39FF14; border-radius:999px; padding:14px 26px; color:#0D2229; font-family:'IBM Plex Mono', monospace; font-size:22px; font-weight:600; letter-spacing:2px;">POWER BI + MCP</div>
    </div>

    <!-- kicker -->
    <div style="margin-top:56px; color:#00D2FF; font-family:'IBM Plex Mono', monospace; font-size:28px; font-weight:600; letter-spacing:6px; text-transform:uppercase;">Connect your AI agents</div>

    <!-- headline -->
    <div style="margin-top:14px;">
      <div style="color:#39FF14; font-size:128px; line-height:0.98; font-weight:700; letter-spacing:-1px;">3 AI AGENTS.</div>
      <div style="color:#00D2FF; font-size:92px; line-height:1.04; font-weight:700; letter-spacing:-1px; margin-top:8px;">1 POWER BI FILE.</div>
    </div>

    <!-- diagram: 3 tool badges converging into Power BI -->
    <div style="position:relative; width:100%; height:460px; margin-top:72px;">

      <svg width="952" height="460" style="position:absolute; top:0; left:0;">
        <line x1="160" y1="176" x2="476" y2="256" stroke="#39FF14" stroke-opacity="0.5" stroke-width="3"/>
        <line x1="476" y1="176" x2="476" y2="256" stroke="#39FF14" stroke-opacity="0.5" stroke-width="3"/>
        <line x1="792" y1="176" x2="476" y2="256" stroke="#39FF14" stroke-opacity="0.5" stroke-width="3"/>
      </svg>

      <!-- Claude Code badge -->
      <div style="position:absolute; top:0; left:70px; width:180px; display:flex; flex-direction:column; align-items:center;">
        <div style="width:112px; height:112px; border-radius:24px; border:2px solid #00D2FF; background:rgba(0,210,255,0.07); display:flex; align-items:center; justify-content:center;">
          <svg width="52" height="52" viewBox="0 0 48 48">
            <g stroke="#39FF14" stroke-width="3.2" stroke-linecap="round">
              <line x1="24" y1="6" x2="24" y2="42"/>
              <line x1="6" y1="24" x2="42" y2="24"/>
              <line x1="10.5" y1="10.5" x2="37.5" y2="37.5"/>
              <line x1="37.5" y1="10.5" x2="10.5" y2="37.5"/>
              <line x1="24" y1="12" x2="24" y2="36" transform="rotate(30 24 24)"/>
              <line x1="24" y1="12" x2="24" y2="36" transform="rotate(-30 24 24)"/>
            </g>
          </svg>
        </div>
        <div style="margin-top:14px; color:#EAF6F4; font-family:'IBM Plex Mono', monospace; font-size:22px; font-weight:600; text-align:center;">Claude Code</div>
      </div>

      <!-- Antigravity badge -->
      <div style="position:absolute; top:0; left:386px; width:180px; display:flex; flex-direction:column; align-items:center;">
        <div style="width:112px; height:112px; border-radius:24px; border:2px solid #00D2FF; background:rgba(0,210,255,0.07); display:flex; align-items:center; justify-content:center;">
          <svg width="52" height="52" viewBox="0 0 48 48">
            <circle cx="24" cy="24" r="17" fill="none" stroke="#39FF14" stroke-width="3.2"/>
            <path d="M24 34 L24 14 M24 14 L15 23 M24 14 L33 23" fill="none" stroke="#39FF14" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div style="margin-top:14px; color:#EAF6F4; font-family:'IBM Plex Mono', monospace; font-size:22px; font-weight:600; text-align:center;">Antigravity</div>
      </div>

      <!-- Codex badge -->
      <div style="position:absolute; top:0; left:702px; width:180px; display:flex; flex-direction:column; align-items:center;">
        <div style="width:112px; height:112px; border-radius:24px; border:2px solid #00D2FF; background:rgba(0,210,255,0.07); display:flex; align-items:center; justify-content:center;">
          <svg width="52" height="52" viewBox="0 0 48 48">
            <polygon points="24,6 40,15 40,33 24,42 8,33 8,15" fill="none" stroke="#39FF14" stroke-width="3.2" stroke-linejoin="round"/>
            <circle cx="24" cy="24" r="6" fill="none" stroke="#39FF14" stroke-width="3.2"/>
          </svg>
        </div>
        <div style="margin-top:14px; color:#EAF6F4; font-family:'IBM Plex Mono', monospace; font-size:22px; font-weight:600; text-align:center;">Codex</div>
      </div>

      <!-- Power BI convergence badge -->
      <div style="position:absolute; top:240px; left:356px; width:240px; display:flex; flex-direction:column; align-items:center;">
        <div style="width:200px; height:200px; border-radius:32px; border:3px solid #39FF14; background:rgba(57,255,20,0.06); display:flex; align-items:center; justify-content:center; box-shadow:0 0 60px rgba(0,210,255,0.18);">
          <svg width="108" height="108" viewBox="0 0 96 96">
            <rect x="16" y="52" width="14" height="30" rx="3" fill="#00D2FF"/>
            <rect x="41" y="34" width="14" height="48" rx="3" fill="#00D2FF"/>
            <rect x="66" y="16" width="14" height="66" rx="3" fill="#00D2FF"/>
          </svg>
        </div>
        <div style="margin-top:16px; color:#00D2FF; font-family:'IBM Plex Mono', monospace; font-size:26px; font-weight:600; letter-spacing:3px;">POWER BI</div>
      </div>

    </div>

    <!-- caption -->
    <div style="margin-top:36px; color:#7FE9DA; font-family:'IBM Plex Mono', monospace; font-size:24px; font-weight:500; letter-spacing:1px;">via Model Context Protocol (MCP)</div>

    <!-- spacer -->
    <div style="flex:1;"></div>

    <!-- footer -->
    <div style="display:flex; flex-direction:column; align-items:center; gap:18px; padding-bottom:24px;">
      <div style="border:2px solid #39FF14; border-radius:999px; padding:16px 32px; color:#39FF14; font-family:'Chakra Petch', sans-serif; font-size:30px; font-weight:600;">Full tutorial &rarr; link below</div>
      <div style="color:#7FE9DA; font-family:'IBM Plex Mono', monospace; font-size:24px; font-weight:500; letter-spacing:3px;">@HAKAMDATASTUDIO</div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
