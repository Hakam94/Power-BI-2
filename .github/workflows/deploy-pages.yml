name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'hakam-web/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: hakam-web/package-lock.json

      - name: Install dependencies
        working-directory: hakam-web
        run: npm ci

      - name: Build
        working-directory: hakam-web
        run: npm run build
        env:
          GH_PAGES: true
          # Optional: set a repo secret named VITE_BUTTONDOWN_USERNAME once
          # you've created a Buttondown account, so the live newsletter form
          # posts to your real list instead of the placeholder handle.
          VITE_BUTTONDOWN_USERNAME: ${{ secrets.VITE_BUTTONDOWN_USERNAME }}

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: hakam-web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
